name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform folder
        run: flutter create --platforms=android --project-name gsbox_app .

      - name: Add INTERNET permission
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $F || sed -i 's#<manifest[^>]*>#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' $F

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gsbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
